[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsan"
version = "0.1.0"
description = "Analítica deportiva de fútbol a partir de video (tracking + etiquetado manual + app)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
# Pesado: se instala en Colab/Kaggle, no hace falta en la laptop.
tracking = ["ultralytics", "supervision==0.27.0", "opencv-python-headless", "scikit-learn", "umap-learn", "gdown", "scipy"]
# Propagación de la calibración entre anclas: solo OpenCV, corre en CPU en la laptop.
calib = ["opencv-python-headless"]
# Detección y seguimiento de jugadoras en la laptop (CPU). OpenVINO acelera el modelo.
detect = ["ultralytics", "openvino", "opencv-python-headless", "scipy"]
# Exportar clips editados y jugadas del pizarrón a MP4 (sportsan.clips.render); además hace falta ffmpeg.
clips = ["opencv-python-headless", "pillow"]
# Bajar videos de YouTube (sportsan.ingest.download_videos).
ingest = ["yt-dlp"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sportsan = ["tracking/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
